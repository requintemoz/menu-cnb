<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13283a">
<title>CNB | Entrada da equipa</title>
<link rel="icon" type="image/png" sizes="48x48" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="estilos.css?v=20261110e">
<script src="lib/supabase.js"></script>
<script src="config.js?v=20261110e"></script>
<script src="comum.js?v=20261110e"></script>
<style>
  .acessos{display:grid;gap:10px;margin-top:6px}
  .acesso{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);min-height:64px}
  .acesso b{font-family:var(--display);font-size:18px}
  .acesso small{color:var(--muted);font-size:14px}
  .acesso:hover,.acesso:focus-visible{border-color:var(--accent)}
  .troca{background:none;border:0;color:var(--sea);font-weight:600;padding:8px 0;text-decoration:underline;font-size:14px}
  #e-msg{color:var(--crit);min-height:20px;font-size:14px}
</style>
</head>
<body>
<header class="top wrap"><div class="brand"><img src="img/monograma-claro.webp" alt="" width="142" height="96"><span>Requinte CNB<small>Entrada da equipa</small></span></div></header>
<section class="view wrap"><div id="e"></div></section>
<div id="toast-root"></div><div id="sheet-root"></div>
<script>
(function () {
  const { sb, sess, esc, toast } = U; const C = window.CNB; const el = document.getElementById('e');
  const para = new URLSearchParams(location.search).get('para') || '';
  const rpc = async (fn, args) => { const { data, error } = await sb.rpc(fn, args || {}); if (error) throw new Error(error.message); return data; };
  // as páginas do restaurante ficam na mesma pasta desta página; as dos bilhetes e das mesas têm endereço próprio
  const destino = url => url.indexOf('/menu-cnb/') === 0 ? new URL(url.slice('/menu-cnb/'.length), location.href).href : new URL(url, location.origin).href;

  function formPin(nomes) {
    el.innerHTML = `<div class="card login"><h2>Entrar</h2><p class="muted" style="margin:0 0 10px">Escolha o seu nome e escreva o PIN (o mesmo do Loyverse).</p>
      <div class="grid"><label>Nome<br><select id="e-nome"><option value="">Escolher...</option>${nomes.map(n => `<option>${esc(n.nome)}</option>`).join('')}</select></label>
      <label>PIN<br><input id="e-pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off"></label>
      <button class="btn primary" id="e-go" type="button">Entrar</button><div id="e-msg" role="alert"></div>
      <button class="troca" id="e-email" type="button">Entrar com email e palavra-passe</button></div></div>`;
    const ultimo = (() => { try { return localStorage.getItem('cnb-ultimo-nome') || ''; } catch (e) { return ''; } })();
    if (ultimo && nomes.some(n => n.nome === ultimo)) document.getElementById('e-nome').value = ultimo;
    const go = async () => {
      const nome = document.getElementById('e-nome').value, pin = document.getElementById('e-pin').value.trim(); const msg = document.getElementById('e-msg'); const b = document.getElementById('e-go');
      if (!nome) { msg.textContent = 'Escolha o seu nome.'; return; } if (!/^\d{4,6}$/.test(pin)) { msg.textContent = 'O PIN tem 4 a 6 algarismos.'; return; }
      b.disabled = true; msg.textContent = '';
      try {
        const r = await fetch(C.SUPABASE_URL + '/functions/v1/entrar', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: C.SUPABASE_KEY, Authorization: 'Bearer ' + C.SUPABASE_KEY }, body: JSON.stringify({ nome, pin }) });
        const j = await r.json(); if (!j.ok) throw new Error(j.erro || 'Não foi possível entrar');
        const { error } = await sb.auth.verifyOtp({ type: 'magiclink', token_hash: j.token_hash }); if (error) throw new Error('Não foi possível abrir a sessão. Tente de novo.');
        try { localStorage.setItem('cnb-ultimo-nome', nome); } catch (e) {}
        await entrou(true);
      } catch (e) { msg.textContent = e.message; b.disabled = false; document.getElementById('e-pin').value = ''; }
    };
    document.getElementById('e-go').addEventListener('click', go); document.getElementById('e-pin').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    document.getElementById('e-email').addEventListener('click', formEmail);
  }
  function formEmail() {
    el.innerHTML = `<div class="card login"><h2>Entrar com email</h2><p class="muted" style="margin:0 0 10px">Para quem tem conta com email e palavra-passe (administração).</p>
      <div class="grid"><label>Email<br><input id="e-mail" type="email" autocomplete="username"></label><label>Palavra-passe<br><input id="e-pass" type="password" autocomplete="current-password"></label>
      <button class="btn primary" id="e-go" type="button">Entrar</button><div id="e-msg" role="alert"></div><button class="troca" id="e-pinv" type="button">Entrar com nome e PIN</button></div></div>`;
    const go = async () => { const msg = document.getElementById('e-msg'); msg.textContent = '';
      const { error } = await sb.auth.signInWithPassword({ email: document.getElementById('e-mail').value.trim(), password: document.getElementById('e-pass').value });
      if (error) { msg.textContent = 'Email ou palavra-passe incorrectos.'; return; } await entrou(true); };
    document.getElementById('e-go').addEventListener('click', go); document.getElementById('e-pass').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    document.getElementById('e-pinv').addEventListener('click', inicio);
  }
  async function sair() { try { await U.api('logout', ''); } catch (e) {} sess.clear(); try { await sb.auth.signOut(); } catch (e) {} inicio(); }
  // depois de entrar: guarda quem é, entra em turno e leva a pessoa à sua página (ou mostra as páginas a que tem acesso)
  async function entrou(acabouDeEntrar) {
    let eu = null, ac = null;
    try { eu = await rpc('fn_eu_resumo'); ac = await rpc('fn_meus_acessos'); } catch (e) { eu = null; }
    if (!eu || !ac) { sess.clear(); try { await sb.auth.signOut(); } catch (e) {} el.innerHTML = `<div class="card login"><h2>Sem acesso</h2><p>Esta conta não está na equipa. Fale com a gerência.</p><div class="actions"><button class="btn" id="e-volta" type="button">Voltar</button></div></div>`; document.getElementById('e-volta').addEventListener('click', inicio); return; }
    sess.set({ user: { id: eu.id, nome: eu.nome, perfil: eu.perfil || '' } });
    if (acabouDeEntrar && eu.perfil) { try { await rpc('fn_entrada_turno'); } catch (e) {} }
    const lista = ac.acessos || [];
    const pedida = para && lista.find(a => a.url.split('/').pop() === para);
    if (pedida) { location.replace(destino(pedida.url)); return; }
    if (acabouDeEntrar && lista.length === 1) { location.replace(destino(lista[0].url)); return; }
    el.innerHTML = `<div class="card login"><h2>Olá, ${esc(String(eu.nome).split(' ')[0])}</h2><p class="muted" style="margin:0 0 10px">${lista.length ? 'Onde quer entrar?' : 'Esta conta ainda não tem páginas atribuídas. Fale com a gerência.'}</p>
      <div class="acessos">${lista.map((a, i) => `<button class="acesso" type="button" data-i="${i}"><b>${esc(a.titulo)}</b><small>${esc(a.texto)}</small></button>`).join('')}</div>
      <div class="actions" style="margin-top:14px"><button class="btn ghost" id="e-sair" type="button">Sair</button></div></div>`;
    el.querySelectorAll('.acesso').forEach(b => b.addEventListener('click', () => { location.href = destino(lista[Number(b.dataset.i)].url); }));
    document.getElementById('e-sair').addEventListener('click', sair);
  }
  async function inicio() {
    el.innerHTML = '<div class="empty">A abrir...</div>';
    try { const { data } = await sb.auth.getSession(); if (data && data.session) { await entrou(false); return; } } catch (e) {}
    try { formPin(await U.api('listarNomes')); } catch (e) { el.innerHTML = `<div class="card login"><h2>Sem ligação</h2><p>Não foi possível ligar ao servidor. Verifique a internet e tente de novo.</p><div class="actions"><button class="btn" type="button" onclick="location.reload()">Tentar de novo</button></div></div>`; }
  }
  inicio();
})();
</script>
</body>
</html>
