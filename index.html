        <h4 id="obg-q1">${esc(qAtend())}</h4><div class="stars" id="obg-st" role="radiogroup" aria-label="${esc(t('estrelasL'))}">${[1, 2, 3, 4, 5].map(n => `<button type="button" role="radio" aria-checked="${n === av.estrelas}" aria-label="${n}" data-n="${n}" class="${n <= av.estrelas ? 'on' : ''}">${ic('estrela')}</button>`).join('')}</div>
        <h4>${t('comida')}</h4><div class="seg" data-q="comida">${['sim', 'razoavel', 'nao'].map((v, i) => `<button type="button" data-v="${v}" class="${av.comida === v ? 'on' : ''}">${t('comidaOp')[i]}</button>`).join('')}</div>
        <h4>${t('espera')}</h4><div class="seg" data-q="espera">${['rapido', 'aceitavel', 'demorado'].map((v, i) => `<button type="button" data-v="${v}" class="${av.espera === v ? 'on' : ''}">${t('esperaOp')[i]}</button>`).join('')}</div>
        <textarea id="obg-com" rows="2" maxlength="500" placeholder="${esc(t('coment'))}"></textarea>
        <button class="btn primary" id="obg-env" type="button" ${av.estrelas ? '' : 'disabled'}>${t('enviarAv')}</button>`}</section>
      <div class="obg-sup" id="obg-sup">${supHtml()}</div>
      <div class="obg-links">${f.google ? `<a class="lk" href="${esc(f.google)}" target="_blank" rel="noopener">${ic('estrela')}<span><b>${t('google')}</b><small>${t('googleSub')}</small></span></a>` : ''}${f.instagram ? `<a class="lk" href="${esc(f.instagram)}" target="_blank" rel="noopener">${ic('camera')}<span><b>${t('insta')}</b><small>${esc(instaNome(f.instagram))}</small></span></a>` : ''}</div></div>`, r => {
      const realca = () => { const box = r.querySelector('#obg-sup'); if (box) box.classList.toggle('destaque', (av.estrelas && av.estrelas <= 2) || av.comida === 'nao'); };
      r.querySelectorAll('#obg-st button').forEach(b => b.addEventListener('click', () => { av.estrelas = +b.dataset.n; r.querySelectorAll('#obg-st button').forEach(x => { const on = +x.dataset.n <= av.estrelas; x.classList.toggle('on', on); x.setAttribute('aria-checked', String(+x.dataset.n === av.estrelas)); }); r.querySelector('#obg-env').disabled = false; realca(); }));
      r.querySelectorAll('.seg').forEach(g => g.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { av[g.dataset.q] = b.dataset.v; g.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); realca(); })));
      const env = r.querySelector('#obg-env');
      if (env) env.addEventListener('click', async () => {
        env.disabled = true;
        try { await api('fidAvaliar', code, visita.id, { estrelas: av.estrelas, comida: av.comida, espera: av.espera, comentario: r.querySelector('#obg-com').value, token: cli ? cli.token : '' }); avEnviada = true; r.querySelector('#obg-av').innerHTML = `<p class="obg-ok">${ic('check')} ${t('avObrigado')}</p>`; renderOrders(); }
        catch (e) { toast(semFid(e) ? t('indispFid') : e.message); env.disabled = false; }
      });
      ligaSup(r); realca(); preencheObrigado();
    });
  }
  function ligaSup(r) {
    const ab = r.querySelector('#sup-abre'); if (!ab) return;
    ab.addEventListener('click', () => {
      const box = r.querySelector('#obg-sup');
      box.innerHTML = `<b>${t('supQ')}</b><textarea id="sup-txt" rows="2" maxlength="500" placeholder="${esc(t('supMotivo'))}"></textarea><div class="actions"><button type="button" class="btn primary" id="sup-go">${ic('pessoa')} ${t('supEnviar')}</button></div>`;
      r.querySelector('#sup-go').addEventListener('click', async () => {
        const go = r.querySelector('#sup-go'); go.disabled = true; const txt = r.querySelector('#sup-txt').value;
        try { await api('fidChamarSupervisor', code, visita.id, txt, cli ? cli.token : ''); }
        catch (e) { if (semFid(e)) { try { await api('chamarGarcom', code, 'Pedir supervisor(a)' + (txt ? ': ' + txt.slice(0, 80) : ''), ''); } catch (e2) { toast(e2.message); go.disabled = false; return; } } else { toast(e.message); go.disabled = false; return; } }
        estado.supervisor = estado.supervisor && !estado.supervisor.c1 ? estado.supervisor : { c0: new Date().toISOString(), aceite: '', c1: '' };
        box.classList.remove('destaque'); box.innerHTML = supHtml(); toast(t('supChamado'), 4000); renderOrders(); poll();
      });
    });
  }
  function preencheObrigado() {
    const q = document.getElementById('obg-q1'); if (q) q.textContent = qAtend();
    const ct = document.getElementById('obg-ct'); if (!ct) return;
    if (contaInfo && contaInfo.cartao) ct.innerHTML = `<p class="obg-ct-ok">${ic('presente')} ${t('esta')}</p>` + cartaoHtml(contaInfo.cartao, true);
    else if (!cli) { ct.innerHTML = `<button type="button" class="fid-faixa" id="obg-reg">${ic('presente')}<span><b>${t('cartao')}</b><small>${t('convite')}</small></span><span class="seta" aria-hidden="true">›</span></button>`; document.getElementById('obg-reg').addEventListener('click', () => registoSheet(c => { contaInfo = Object.assign({}, contaInfo, { cartao: c }); obrigadoSheet(); })); }
    else ct.innerHTML = '';
  }
  async function poll() { try { estado = await api('estadoMesaCliente', code, visita.id); renderOrders(); const k = JSON.stringify(estado.supervisor || null), box = document.getElementById('obg-sup'); if (k !== supKey && box && !document.getElementById('sup-txt')) { box.innerHTML = supHtml(); ligaSup(document.getElementById('sheet-root')); } supKey = k; } catch (e) {} }
  render(); poll(); setInterval(poll, CNB.POLL_CLIENTE_MS);
})();
</script>
</body>
</html>
